version: 2

updates:
  # Keep GitHub Actions (in .github/workflows) up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  # Keep the codex-sub-plugin Go module up to date.
  - package-ecosystem: "gomod"
    directory: "/codex-sub-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      go-toolchain:
        patterns:
          - "go"

  # Keep the claude-sub-plugin Go module up to date.
  - package-ecosystem: "gomod"
    directory: "/claude-sub-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    groups:
      go-toolchain:
        patterns:
          - "go"
